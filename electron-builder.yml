name: Connextion App
appId: com.connextion.app
productName: Connextion App
directories:
  buildResources: public
  output: out
files:
  - dist/**/*
  - node_modules/**/*
  - package.json

win:
  target:
    - nsis
    - portable
  certificateFile: null
  certificatePassword: null

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Connextion App

mac:
  target:
    - dmg
    - zip
  category: public.app-category.food-and-drink

linux:
  target:
    - AppImage
    - deb
  category: Utility

publish:
  provider: github
  owner: Key-Neil
  repo: Connextion-app-electron
