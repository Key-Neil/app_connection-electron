<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Connexion - App de Livraison</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <div class="container">
        <div id="login-view">
            <h2>Connexion</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
            </form>
            <div class="toggle-link">
                Pas de compte ? <a id="show-register">S'inscrire</a>
            </div>
            <div id="login-message" class="message"></div>
        </div>

        <div id="register-view" style="display: none;">
            <h2>Inscription</h2>
            <form id="register-form">
                <input type="text" id="register-nom" placeholder="Nom" required>
                <input type="text" id="register-prenom" placeholder="Prénom" required>
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Mot de passe" required>
                <button type"submit">Créer le compte</button>
            </form>
            <div class="toggle-link">
                Déjà un compte ? <a id="show-login">Se connecter</a>
            </div>
            <div id="register-message" class="message"></div>
        </div>
    </div>

    <script src="./renderer.js" defer></script>
</body>
</html>
